name: CodeGuard AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt bcrypt pytest
          
      - name: Seed & Verify Database Schema
        run: |
          python backend/seed_data.py
          
      - name: Run Backend Health Test
        run: |
          python -c "from app.main import app; print('FastAPI imported successfully')"
        env:
          DATABASE_URL: "sqlite:///./test.db"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Build React Vite Application
        run: |
          cd frontend
          npm run build
